<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"selfRequestsOnly": true, "allowEval": false}'>
  <title>{% block title %}vigil{% endblock %} - vigil</title>
  <link rel="stylesheet" href="/static/vigil.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">vigil</a>
    <nav>
      <a href="/">Sessions</a>
      <a href="/usage">Usage</a>
      {# Add a nav link by appending one line here. #}
      {% if request.scope.get("vigil.access") == "cookie" %}<form method="post" action="/logout"><button type="submit">Log out</button></form>{% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Resume and metadata edits answer with JSON: show the answer in the element the form names
    // as its hx-target, instead of swapping the JSON in.
    document.body.addEventListener("htmx:beforeSwap", function (event) {
      var xhr = event.detail.xhr;
      if ((xhr.getResponseHeader("Content-Type") || "").indexOf("application/json") !== 0) return;
      event.detail.shouldSwap = false;
      event.detail.isError = false;
      var data = {};
      try { data = JSON.parse(xhr.responseText); } catch (err) { /* shown as a failure below */ }
      var target = event.detail.target;
      target.replaceChildren();
      if (data.ok === true && data.attach) {
        var code = document.createElement("code");
        code.textContent = data.attach;
        target.className = "result ok";
        var where = data.machine ? " on " + data.machine : "";
        target.append(data.opened_terminal ? "Opened in a terminal" + where + ": " : "Attach" + where + " with: ", code);
      } else if (data.id) {
        target.className = "result ok";
        target.append("Saved");
      } else {
        target.className = "result refused";
        target.append(data.reason || data.detail || "Request failed (" + xhr.status + ")");
      }
    });
  </script>
  <script>
    // "Show N idle sessions" unfolds the idle sessions of an active project. Delegated from the
    // document so it keeps working after the live search swaps the results.
    document.addEventListener("click", function (event) {
      var button = event.target instanceof Element ? event.target.closest("button.more") : null;
      if (!button) return;
      var project = button.closest("details.project");
      if (!project) return;
      var open = project.classList.toggle("unfolded");
      button.setAttribute("aria-expanded", open ? "true" : "false");
      button.textContent = open ? "Hide idle sessions" : button.dataset.label;
    });
  </script>
</body>
</html>
