<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"selfRequestsOnly": true, "allowEval": false}'>
  <title>{% block title %}vigil{% endblock %} - vigil</title>
  <link rel="stylesheet" href="/static/vigil.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">vigil</a>
    <nav>
      <a href="/">Sessions</a>
      <a href="/usage">Usage</a>
      {# Add a nav link by appending one line here. #}
      {% if request.scope.get("vigil.access") == "cookie" %}<form method="post" action="/logout"><button type="submit">Log out</button></form>{% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Resume, reviews and metadata edits answer with JSON: show the answer in the element the form names
    // as its hx-target, instead of swapping the JSON in.
    document.body.addEventListener("htmx:beforeSwap", function (event) {
      var xhr = event.detail.xhr;
      if ((xhr.getResponseHeader("Content-Type") || "").indexOf("application/json") !== 0) return;
      event.detail.shouldSwap = false;
      event.detail.isError = false;
      var data = {};
      try { data = JSON.parse(xhr.responseText); } catch (err) { /* shown as a failure below */ }
      var target = event.detail.target;
      target.replaceChildren();
      // The row (or detail section) that holds the target also holds the restart confirm step.
      var scope = target.closest("li.session, section");
      var confirmStep = scope ? scope.querySelector(".restart-confirm") : null;
      if (confirmStep && /\/restart-remote$/.test(new URL(xhr.responseURL).pathname)) confirmStep.hidden = true;
      // Only ever to a Claude link: the answer may have come from another machine.
      var link = typeof data.remote_url === "string" && /^https:\/\/claude\.ai\/code\//.test(data.remote_url) ? data.remote_url : null;
      if (data.ok === true && link) {
        var open = document.createElement("a");
        open.href = link;
        open.textContent = "Open in Claude";
        target.className = "result ok";
        target.append("Opening Claude: ", open);
        window.location.href = link;
      } else if (data.ok === true && data.pending === true) {
        var page = document.createElement("a");
        var path = new URL(xhr.responseURL).pathname;
        // A review suggestion's resume or new session: its page may not exist yet, so the list.
        var ofSession = /\/sessions\/[^/]+\/(resume|restart-remote)$/.test(path);
        page.href = ofSession ? path.replace(/\/(resume|restart-remote)$/, "") : "/";
        page.textContent = ofSession ? "the session page" : "the sessions list";
        target.className = "result ok";
        target.append("Started; the Remote Control link is not available yet. Try ", page, " in a moment.");
      } else if (data.ok === true && data.attach) {
        var code = document.createElement("code");
        code.textContent = data.attach;
        target.className = "result ok";
        var where = data.machine ? " on " + data.machine : "";
        target.append(data.opened_terminal ? "Opened in a terminal" + where + ": " : "Attach" + where + " with: ", code);
      } else if (typeof data.review_id === "number") {
        // A review started (show it in the list; it polls itself), or one is already running.
        target.className = data.ok === true ? "result ok" : "result refused";
        target.append(data.ok === true ? "Review started" : (data.reason || "A review is already running"));
        var list = document.getElementById("reviews");
        // Only a review this request started is surely this session's; a busy one may not be.
        if (data.ok === true && list && !document.getElementById("review-" + data.review_id)) {
          var fragment = new URL(xhr.responseURL).pathname.replace(/\/review$/, "/reviews/" + data.review_id);
          htmx.ajax("GET", fragment, {target: "#reviews", swap: "afterbegin"});
        }
      } else if (data.ok === true && Array.isArray(data.default_flags)) {
        // "Always use" on a flag suggestion: what resume.default_flags now holds.
        var flags = document.createElement("code");
        flags.textContent = data.default_flags.join(" ");
        target.className = "result ok";
        target.append(data.machine ? "Saved on " + data.machine + "; every launch there now gets " : "Saved; every launch now gets ", flags);
      } else if (data.ok === true && typeof data.path === "string") {
        // Apply on a file suggestion: the file written.
        var written = document.createElement("code");
        written.textContent = data.path;
        target.className = "result ok";
        target.append(data.machine ? "Written on " + data.machine + ": " : "Written: ", written);
      } else if (data.id) {
        target.className = "result ok";
        target.append("Saved");
      } else {
        target.className = "result refused";
        target.append(data.reason || data.detail || "Request failed (" + xhr.status + ")");
        if (data.restartable === true && confirmStep) {
          // The button opens the confirm step; nothing is stopped until that is confirmed.
          var restart = document.createElement("button");
          restart.type = "button";
          restart.className = "restart";
          restart.textContent = "Restart with Remote Control";
          target.append(" ", restart);
        }
      }
    });
  </script>
  <script>
    // Restart with Remote Control: the button in a refusal opens the confirm step; Cancel closes
    // it. Delegated, like the idle fold below, so it survives the live search swapping results.
    document.addEventListener("click", function (event) {
      var button = event.target instanceof Element ? event.target.closest("button.restart, button.cancel") : null;
      if (!button) return;
      var scope = button.closest("li.session, section");
      var step = scope ? scope.querySelector(".restart-confirm") : null;
      if (step) step.hidden = button.classList.contains("cancel");
    });
  </script>
  <script>
    // Copy buttons (button.copy): the clipboard needs a secure context, so over plain http from
    // another machine the command next to the button is selected for copying by hand instead.
    document.addEventListener("click", function (event) {
      var button = event.target instanceof Element ? event.target.closest("button.copy") : null;
      if (!button) return;
      var code = button.parentElement ? button.parentElement.querySelector("code") : null;
      function select() {
        if (!code) return;
        var range = document.createRange();
        range.selectNodeContents(code);
        var selection = window.getSelection();
        if (selection) { selection.removeAllRanges(); selection.addRange(range); }
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(button.dataset.copy || "").then(function () {
          button.textContent = "Copied";
        }, select);
      } else {
        select();
      }
    });
  </script>
  <script>
    // "Show N idle sessions" unfolds the idle sessions of an active project. Delegated from the
    // document so it keeps working after the live search swaps the results.
    document.addEventListener("click", function (event) {
      var button = event.target instanceof Element ? event.target.closest("button.more") : null;
      if (!button) return;
      var project = button.closest("details.project");
      if (!project) return;
      var open = project.classList.toggle("unfolded");
      button.setAttribute("aria-expanded", open ? "true" : "false");
      button.textContent = open ? "Hide idle sessions" : button.dataset.label;
    });
  </script>
</body>
</html>
